---
layout: default
---
<article class="document document--reading">
  {% include page-heading.html title=page.title %}
  <p class="byline">
    {% if page.author %}<span>{{ page.author | escape }}</span>{% endif %}
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d %B %Y" }}</time>
    <span data-danetian-date="{{ page.date | date: '%Y-%m-%d' }}"></span>
  </p>
  {% if page.cover %}<div class="post-cover"><img src="{{ page.cover | relative_url | escape }}" alt="{{ page.cover_alt | default: '' | escape }}"></div>{% endif %}
  <div class="prose">{{ content }}</div>
  {% include post-nav.html %}
</article>
