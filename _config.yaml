name: Danetian Academy
url: "https://danetiska.com"
description: >-
  The Danetian Academy is dedicated to the study, development, and documentation
  of Danetian, a constructed Indo-European language with its own history,
  literature, and culture.
#permalink: /blog/:title
permalink: /:collection/:title
plugins:
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-seo-tag
collections:
  language:
    output: false
  texts:
    output: false
  academicians:
    output: true
    permalink: /academy/academicians/:name/
email: academia@danetiska.com
exclude:
  - README.md
  - docs
  - tests
  - scripts

defaults:
  - scope:
      path: ""
      type: academicians
    values:
      layout: academician
      section: academy
      section_pagination: false
      image: /assets/images/danetiska_academia_logo_square.svg
      fit: contain
