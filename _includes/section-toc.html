{% assign section = site.data.sections[page.section] %}

<nav class="section-toc" aria-label="{{ section.title }} contents">
  <a class="section-toc-title" href="{{ section.home }}">
    {{ section.title }}
  </a>

  <ul>
    {% for item in section.items %}
      {% assign item_url = item.url | relative_url %}
      {% assign page_url = page.url | relative_url %}

      <li>
        <a
          href="{{ item_url }}"
          {% if page_url == item_url %}
            class="current"
            aria-current="page"
          {% endif %}
        >
          {{ item.title }}
        </a>
      </li>
    {% endfor %}
  </ul>
</nav>
