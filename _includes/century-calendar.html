<section
  class="century-calendar"
  data-century-calendar
  data-start-year="{{ include.start_year | default: 4400 }}"
  data-years="{{ include.years | default: 100 }}"
  aria-label="{{ include.title | default: 'Calendar century' }}"
  hidden
>
  <header class="century-calendar__header">
    <button
      class="century-calendar__arrow century-calendar__previous"
      type="button"
      aria-label="Previous century"
    >
      ‹
    </button>

    <button
      class="century-calendar__title"
      type="button"
    >
      {{ include.title | default: 4400 }}
    </button>

    <button
      class="century-calendar__arrow century-calendar__next"
      type="button"
      aria-label="Next century"
    >
      ›
    </button>
  </header>

  <div
    class="century-calendar__years"
    role="grid"
    aria-label="Years in the century"
  ></div>
</section>
