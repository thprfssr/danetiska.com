<div class="bible-reader" id="bible-reader">
  <div class="bible-reader-nav">
    <button
      class="bible-nav-button"
      id="bible-prev"
      type="button"
      aria-label="Previous chapter"
    >
      ‹
    </button>

    <label>
      <span class="sr-only">Book</span>
      <select id="bible-book"></select>
    </label>

    <label>
      <span class="sr-only">Chapter</span>
      <select id="bible-chapter"></select>
    </label>

    <button
      class="bible-nav-button"
      id="bible-next"
      type="button"
      aria-label="Next chapter"
    >
      ›
    </button>
  </div>

  <div class="bible-languages" id="bible-languages">
    <button
      type="button"
      data-text="danetian"
      aria-pressed="true"
      class="active"
    >
      Danetian
    </button>

    <button
      type="button"
      data-text="english"
      aria-pressed="true"
      class="active"
    >
      English
    </button>

    <button
      type="button"
      data-text="greek"
      aria-pressed="false"
    >
      Greek
    </button>

    <button
      type="button"
      data-text="latin"
      aria-pressed="false"
    >
      Latin
    </button>

    <button
      type="button"
      data-text="slavonic"
      aria-pressed="false"
    >
      Slavonic
    </button>
  </div>

  <p class="bible-status" id="bible-status">
    Loading texts…
  </p>

  <article id="bible-content" hidden>
    <h1 id="bible-heading"></h1>
    <div class="bible-verses" id="bible-verses"></div>
  </article>
</div>

<script src="{{ '/assets/scripts/bible-reader.js' | relative_url }}"></script>
