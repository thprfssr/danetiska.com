<header class="{{ include.kind }}-calendar__header">
  <button class="{{ include.kind }}-calendar__arrow {{ include.kind }}-calendar__previous" type="button" aria-label="Previous {{ include.kind }}">‹</button>
  <button class="{{ include.kind }}-calendar__title" type="button">{{ include.title | escape }}</button>
  <button class="{{ include.kind }}-calendar__arrow {{ include.kind }}-calendar__next" type="button" aria-label="Next {{ include.kind }}">›</button>
</header>
