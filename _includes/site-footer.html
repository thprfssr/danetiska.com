<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-main">
      <div class="footer-identity">
        <a class="footer-home" href="{{ '/' | relative_url }}" aria-label="Danetian Academy home">
          <img src="{{ '/assets/images/danetiska_academia_logo_white.svg' | relative_url }}" alt="Danetiska Academia" width="240" height="63">
        </a>
        <p class="footer-description">Preserving and advancing Danetian language, history, and culture.</p>
      </div>

      <nav class="footer-legal" aria-labelledby="footer-information-title">
        <h2 id="footer-information-title">Information</h2>
        <ul>
          <li><a href="{{ '/editorial-note' | relative_url }}">Editorial note</a></li>
          <li><a href="{{ '/privacy' | relative_url }}">Privacy</a></li>
          <li><a href="{{ '/external-resources' | relative_url }}">External resources</a></li>
        </ul>
      </nav>

      <section class="footer-follow" aria-labelledby="footer-follow-title">
        <h2 id="footer-follow-title">Follow us</h2>
        {% include social-links.html %}
        <a class="footer-email" href="mailto:{{ site.email | escape }}">{{ site.email | escape }}</a>
      </section>
    </div>

    <div class="footer-bottom">
      <small class="footer-copyright">© 2016–{{ "now" | date: "%Y" }} Danetian Academy. All rights reserved.</small>
      <div class="footer-patronage">
        <span>Under the patronage of</span>
        <img src="{{ '/assets/images/ministeriom_culturas_educatziones_i_recercas.svg' | relative_url }}" alt="Danetiska Respublica: Ministeriom Culturas, Educatziones, i Recercas" width="216" height="48">
      </div>
    </div>
  </div>
</footer>
