<section
  class="year-calendar"
  data-year-calendar
  data-year="{{ include.year | default: include.title }}"
  data-months="{{ include.months | default: 12 }}"
  aria-label="{{ include.title | default: 'Calendar year' }}"
  hidden
>
  {% assign calendar_title = include.title | default: "Year" %}
  {% include calendar-header.html kind="year" title=calendar_title %}

  <div
    class="year-calendar__months"
    role="grid"
    aria-label="Months of {{ include.title | default: 'the year' }}"
  ></div>
</section>
