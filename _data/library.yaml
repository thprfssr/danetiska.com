introduction: Explore the Academy's texts, scholarly editions, reference works, and tools.
collections:
  - id: bible
    label: Featured edition
    title: Kustendja Polyglot Bible
    description: A parallel reader for comparing biblical texts across languages and traditions.
    url: /bible/
    action: Open reader
    featured: true
    details:
      - title: English
      - title: Latin
      - title: Greek
      - title: Slavonic
