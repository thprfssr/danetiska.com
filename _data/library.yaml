introduction: Explore the Academy's texts, scholarly editions, reference works, and tools.
collections:
  - &piesca
    id: piesca
    label: Featured tool
    title: PIESCA
    description: Explore Proto-Indo-European words and inflection tables through your own sound changes. Based on Mark Rosenfelder’s SCA².
    url: /piesca/
    action: Open PIESCA
    featured: true
    details:
      - title: Dictionary
        note: Search words, meanings, and inflected forms.
      - title: SCA2
        note: Apply your own sound changes to the entire dictionary.
  - id: texts
    label: Texts
    title: Danetian texts
    description: Literature, translations, prayers, and scientific writing, with parallel English texts.
    url: /texts
    action: Browse texts
  - id: reference
    label: Reference
    title: Books & papers
    description: A catalogue of works supporting the study of language, history, and the sciences.
    url: /library/reference/
    action: Browse catalogue
tools:
  - *piesca
  - title: Kustendja Polyglot Bible
    description: Compare biblical texts side by side across languages and traditions.
    url: /bible/
  - title: Danetian Calendar
    description: Explore the calendar and convert dates.
    url: /calendar
  - title: Lexerat
    description: Prepare and publish dictionaries.
    url: https://github.com/elementalbasis/lexerat
  - title: DanuWiki
    description: Explore a Zettelkasten-style bilingual corpus.
    url: https://wiki.danetiska.com
  - title: ftp.danetiska.com
    description: Browse the Academy's public folder.
    url: https://ftp.danetiska.com
filters:
  - title: All
    tag: all
  - title: Books
    tag: book
  - title: Papers
    tag: paper
  - title: Manuals
    tag: manual
  - title: Theses
    tag: thesis
