title: Psalms
chapter: 50
units:
  - id: 3
    dan: >
      Mileioste me, Dive, seponts mysjlam milotam Tvoiam; ide seponts plyrotam
      sjodysjtrytiom, tropriskeie derysjtam moiam.
    eng: >
      Have mercy upon me, O God, according to thy great mercy; and according to
      the multitude of thy compassions blot out my transgression.
    grk: >
      ΕΛΕΗΣΟΝ με, ὁ Θεός, κατὰ τὸ μέγα ἔλεός σου καὶ κατὰ τὸ πλῆθος τῶν
      οἰκτιρμῶν σου ἐξάλειψον τὸ ἀνόμημά μου·
    sla: >
      Помилуй мя, Боже, по велицей милости твоей, и по множеству щедрот твоих
      очисти беззаконiе мое.
    lat: >
      Miserere mei, Deus, secundum misericordiam tuam; et secundum multitudinem
      miserationum tuarum dele iniquitatem meam.
  - id: 4
    dan: >
      Plyre djystre skrebe me apo derysjtamos moiamos, ide apo skyltied moiad
      tropriskeie me.
    eng: >
      Wash me thoroughly from mine iniquity, and cleanse me from my sin.
    grk: >
      ἐπὶ πλεῖον πλῦνόν με ἀπὸ τῆς ἀνομίας μου καὶ ἀπὸ τῆς ἁμαρτίας μου
      καθάρισόν με.
    sla: >
      Наипаче омый мя от беззаконiя моего и от греха моего очисти мя;
    lat: >
      Amplius lava me ab iniquitate mea et a peccato meo munda me.
  - id: 5
    dan: >
      Jasme derysjtam moiam edja sjnoio, ide skeltis moia anti mene esti
      visjoda.
    eng: >
      For I am conscious of mine iniquity; and my sin is continually before me.
    grk: >
      ὅτι τὴν ἀνομίαν μου ἐγὼ γινώσκω, καὶ ἡ ἁμαρτία μου ἐνώπιόν μού ἐστι
      διαπαντός.
    sla: >
      яко беззаконiе мое аз знаю, и грех мой предо мною eсть выну.
    lat: >
      Quoniam iniquitatem meam ego cognosco, et peccatum meum contra me est
      semper.
  - id: 6
    dan: >
      Proti Tve inokom skyltiostom, ide dusbytom anti Teve masjym, jasme
      rysjteiostoita en verdoisu Tvoioisu, ide viksies joda krinostoita.
    eng: >
      Against thee only have I sinned, and done evil before thee: that thou
      mightest be justified in thy sayings, and mightest overcome when thou art
      judged.
    grk: >
      σοὶ μόνῳ ἥμαρτον καὶ τὸ πονηρὸν ἐνώπιόν σου ἐποίησα, ὅπως ἂν δικαιωθῇς ἐν
      τοῖς λόγοις σου, καὶ νικήσῃς ἐν τῷ κρίνεσθαί σε.
    sla: >
      Тебе eдиному согреших и лукавое пред тобою сотворих; яко да оправдишися во
      словесех твоих и победиши, внегда судити ти.
    lat: >
      Tibi, tibi soli peccavi et malum coram te feci, ut iustus inveniaris in
      sententia tua et aequus in iudicio tuo.
  - id: 7
    dan: >
      Bo vid, en derysjtasu sjoprymeiosta, ide en skyltisu djenostet me mater
      moia.
    eng: >
      For, behold, I was conceived in iniquities, and in sins did my mother
      conceive me.
    grk: >
      ἰδοὺ γὰρ ἐν ἀνομίαις συνελήφθην, καὶ ἐν ἁμαρτίαις ἐκίσσησέ με ἡ μήτηρ μου.
    sla: >
      Се бо, в беззаконiих зачат eсмь, и во гресех роди мя мати моя.
    lat: >
      Ecce enim in iniquitate generatus sum, et in peccato concepit me mater
      mea.
  - id: 8
    dan: >
      Bo vid, verotam lubiostes; nesjnyta i sjelosta vidrotas Tvoias prodisjs
      medjo.
    eng: >
      For, behold, thou lovest truth: thou hast manifested to me the secret and
      hidden things of thy wisdom.
    grk: >
      ἰδοὺ γὰρ ἀλήθειαν ἠγάπησας, τὰ ἄδηλα καὶ τὰ κρύφια τῆς σοφίας σου ἐδήλωσάς
      μοι.
    sla: >
      Се бо, истину возлюбил eси, безвестная и тайная премудрости твоея явил ми
      eси.
    lat: >
      Ecce enim veritatem in corde dilexisti et in occulto sapientiam
      manifestasti mihi.
  - id: 9
    dan: >
      Isi embreionts me sjom hyssope, ide imi tropriskeiomnos. Isi skrebonts me,
      i snibes po albos imi dykmynos.
    eng: >
      Thou shalt sprinkle me with hyssop, and I shall be purified: thou shalt
      wash me, and I shall be made whiter than snow.
    grk: >
      ραντιεῖς με ὑσσώπῳ, καὶ καθαρισθήσομαι, πλυνεῖς με, καὶ ὑπὲρ χιόνα
      λευκανθήσομαι.
    sla: >
      Окропиши мя иссопом, и очищуся; омыеши мя, и паче снега убелюся.
    lat: >
      Asperges me hyssopo, et mundabor; lavabis me, et super nivem dealbabor.
  - id: 10
    dan: >
      Isi me sjlununi dykonts gauram i prinotam; jenti gaureiontes osta
      uponideiekmyna.
    eng: >
      Thou shalt cause me to hear gladness and joy: the afflicted bones shall
      rejoice.
    grk: >
      ἀκουτιεῖς μοι ἀγαλλίασιν καὶ εὐφροσύνην, ἀγαλλιάσονται ὀστέα
      τεταπεινωμένα.
    sla: >
      Слуху моему даси радость и веселiе; возрадуются кости смирeнныя.
    lat: >
      Audire me facies gaudium et laetitiam, et exsultabunt ossa, quae
      contrivisti.
  - id: 11
    dan: >
      Apoverte pretiops Tvoiom apo skyltimos moiomos, ide visjans derysjtans
      moians tropriskeie.
    eng: >
      Turn away thy face from my sins, and blot out all mine iniquities.
    grk: >
      ἀπόστρεψον τὸ πρόσωπόν σου ἀπὸ τῶν ἁμαρτιῶν μου καὶ πάσας τὰς ἀνομίας μου
      ἐξάλειψον.
    sla: >
      Отврати лице твое от грех моих и вся беззаконiя моя очисти.
    lat: >
      Averte faciem tuam a peccatis meis et omnes iniquitates meas dele.
  - id: 12
    dan: >
      Sjerd priskom masj en moi, Dive, ide prumyn rysjtom etineveie en ontroisu
      moioisu.
    eng: >
      Create in me a clean heart, O God; and renew a right spirit in my inward
      parts.
    grk: >
      καρδίαν καθαρὰν κτίσον ἐν ἐμοί, ὁ Θεός, καὶ πνεῦμα εὐθὲς ἐγκαίνισον ἐν
      τοῖς ἐγκάτοις μου.
    sla: >
      Сердце чисто созижди во мне, Боже, и дух прав обнови во утробе моей.
    lat: >
      Cor mundum crea in me, Deus, et spiritum firmum innova in visceribus meis.
  - id: 13
    dan: >
      Ne apoiksies me apo pretiped Tvoiod, ide Prumyn Tvoiom Sjuntom ne
      apokypiois med.
    eng: >
      Cast me not away from thy presence; and remove not thy holy Spirit from
      me.
    grk: >
      μὴ ἀποῤῥίψῃς με ἀπὸ τοῦ προσώπου σου καὶ τὸ πνεῦμά σου τὸ ἅγιον μὴ
      ἀντανέλῃς ἀπ᾿ ἐμοῦ.
    sla: >
      Не отвержи менe от лица твоего и дха твоего святаго не отими от менe.
    lat: >
      Ne proicias me a facie tua et spiritum sanctum tuum ne auferas a me.
  - id: 14
    dan: >
      Etidido medjo prinotam spysjties Tvoias, ide Prumene Redjonte anastele me.
    eng: >
      Restore to me the joy of thy salvation: establish me with thy directing
      Spirit.
    grk: >
      ἀπόδος μοι τὴν ἀγαλλίασιν τοῦ σωτηρίου σου καὶ πνεύματι ἡγεμονικῷ στήριξόν
      με.
    sla: >
      Воздаждь ми радость спасенiя твоего и дхом влчним утверди мя.
    lat: >
      Redde mihi laetitiam salutaris tui et spiritu promptissimo confirma me.
  - id: 15
    dan: >
      Imi endisjnunts derysjtomos pontom Tvoiom, ide desjspitioi Tebio jenti
      sjovertontes.
    eng: >
      Then will I teach transgressors thy ways; and ungodly men shall turn to
      thee.
    grk: >
      διδάξω ἀνόμους τὰς ὁδούς σου, καὶ ἀσεβεῖς ἐπὶ σὲ ἐπιστρέψουσι.
    sla: >
      Научу беззаконныя путeм твоим, и нечестивiи к тебе обратятся.
    lat: >
      Docebo iniquos vias tuas, et impii ad te convertentur.
  - id: 16
    dan: >
      Ludreie me esj krevesed, Dive, Dive spysjties moias; iti gaureionts
      dyndjua moia rysjtotam Tvoiam.
    eng: >
      Deliver me from blood-guiltiness, O God, the God of my salvation: and my
      tongue shall joyfully declare thy righteousness.
    grk: >
      ρῦσαί με ἐξ αἱμάτων, ὁ Θεὸς ὁ Θεὸς τῆς σωτηρίας μου· ἀγαλλιάσεται ἡ γλῶσσά
      μου τὴν δικαιοσύνην σου.
    sla: >
      Избави мя от кровей, Боже, Боже спасенiя моего; возрадуется язык мой
      правде твоей.
    lat: >
      Libera me de sanguinibus, Deus, Deus salutis meae, et exsultabit lingua
      mea iustitiam tuam.
  - id: 17
    dan: >
      Poti, osna moia isi apokrudonts, ide os moiom iti pro'uponts farnam
      Tvoiam.
    eng: >
      O Lord, thou shalt open my lips; and my mouth shall declare thy praise.
    grk: >
      Κύριε, τὰ χείλη μου ἀνοίξεις, καὶ τὸ στόμα μου ἀναγγελεῖ τὴν αἴνεσίν σου.
    sla: >
      Господи, устне мои отверзеши, и уста моя возвестят хвалу твою.
    lat: >
      Domine, labia mea aperies, et os meum annuntiabit laudem tuam.
  - id: 18
    dan: >
      Jasme je veliostois jasnam, toda diem; sjom visjyngribi ne isi
      dybrovelionts.
    eng: >
      For if thou desiredst sacrifice, I would have given it: thou wilt not take
      pleasure in whole-burnt-offerings.
    grk: >
      ὅτι εἰ ἠθέλησας θυσίαν, ἔδωκα ἄν· ὁλοκαυτώματα οὐκ εὐδοκήσεις.
    sla: >
      Яко аще бы восхотел eси жертвы, дал бых убо; всесожжeнiя не благоволиши.
    lat: >
      Non enim sacrificio delectaris; holocaustum, si offeram, non placebit.
  - id: 19
    dan: >
      Jasna Divoi, prumyn rupstom; sjerd rupstom i uponideiostom Divos ne isi
      nidspesjonts.
    eng: >
      Sacrifice to God is a broken spirit: a broken and humbled heart God will
      not despise.
    grk: >
      θυσία τῷ Θεῷ πνεῦμα συντετριμμένον, καρδίαν συντετριμμένην καὶ
      τεταπεινωμένην ὁ Θεὸς οὐκ ἐξουδενώσει.
    sla: >
      Жертва Богу дух сокрушен; сердце сокрушенно и смиренно Бог не уничижит.
    lat: >
      Sacrificium Deo spiritus contribulatus; cor contritum et humiliatum, Deus,
      non despicies.
  - id: 20
    dan: >
      Dybrodek, Poti, en dybrovelii Tvoii Sionei, ide sjostrunuiento devares
      Jerusalemes.
    eng: >
      Do good, O Lord, to Sion in thy good pleasure; and let the walls of
      Jerusalem be built.
    grk: >
      ἀγάθυνον, Κύριε, ἐν τῇ εὐδοκίᾳ σου τὴν Σιών, καὶ οἰκοδομηθήτω τὰ τείχη
      ῾Ιερουσαλήμ·
    sla: >
      Ублажи, Господи, благоволенiем твоим Сiона, и да созиждутся стены
      Iерусалимскiя;
    lat: >
      Benigne fac, Domine, in bona voluntate tua Sion, ut aedificentur muri
      Ierusalem.
  - id: 21
    dan: >
      Toda isi dybrovelionts sjom jasnabi rysjtotas, sjom udbyrtibi i
      visjyngribi; toda jenti prostelontes ana jasnastanam Tvoiam tauroisjons.
    eng: >
      Then shalt thou be pleased with a sacrifice of righteousness, offering,
      and whole-burnt-sacrifices: then shall they offer calves upon thine altar.
    grk: >
      τότε εὐδοκήσεις θυσίαν δικαιοσύνης, ἀναφορὰν καὶ ὁλοκαυτώματα· τότε
      ἀνοίσουσιν ἐπὶ τὸ θυσιαστήριόν σου μόσχους.
    sla: >
      тогда благоволиши жертву правды, возношенiе и всесожегаeмая; тогда
      возложат на oлтарь твой телцы.
    lat: >
      Tunc acceptabis sacrificium iustitiae, oblationes et holocausta; tunc
      imponent super altare tuum vitulos.
